<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="esqueceu-senha.css">
</head>
<body>

<div class="container">

    <a href="login.html" class="voltar">← Voltar</a>

    <div class="card">

        <div class="icone">✉</div>

        <h2>Esqueceu sua senha?</h2>

        <p>
            Digite seu e-mail para receber um código de recuperação
        </p>

        <label>E-mail</label>

        <input
            type="email"
            id="email"
            placeholder="seu@email"
        >

        <button id="btnEnviar" class="entrar">
            Enviar Código
        </button>

        <p id="mensagem"></p>

    </div>

</div>

<script src="esqueceu-senha.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - EcoProject</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
 
<body>
 
    <div class="container">
 
        <a href="index.html" class="voltar">← Voltar</a>
 
        <div class="logo">
            <h1>TungProject</h1>
            <p>Planejamentos de Projetos Estáveis</p>
        </div>
 
        <div class="tabs">
            <button type="button" onclick="window.location='login.html'">Entrar</button>
            <button type="button" class="ativo">Criar conta</button>
        </div>
 
        <div class="card">
            <h2>Criar sua conta</h2>
            <p>Preencha os dados abaixo</p>
 
            <form>
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                </div>
 
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Seu@email">
                </div>
 
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="********">
                </div>
 
                <div class="input-group">
                    <label>Tipo de conta</label>
                    <div class="tipo-conta">
                        <button type="button" class="tipo-btn ativo" data-tipo="aluno" onclick="selecionarTipo(this)">Aluno</button>
                        <button type="button" class="tipo-btn" data-tipo="professor" onclick="selecionarTipo(this)">Professor</button>
                    </div>
                    <input type="hidden" id="tipoConta" value="aluno">
                </div>
 
                <button type="submit" class="criar">Criar Conta</button>
            </form>
        </div>
 
    </div>
 
    <script>
        function selecionarTipo(botaoClicado) {
            document.querySelectorAll('.tipo-btn').forEach(function (btn) {
                btn.classList.remove('ativo');
            });
            botaoClicado.classList.add('ativo');
            document.getElementById('tipoConta').value = botaoClicado.dataset.tipo;
        }
    </script>
 
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAG2pyHoAVcQiWsZIZplQ7k1FYWRisdgLc",
    authDomain: "tungproject-8f6cf.firebaseapp.com",
    projectId: "tungproject-8f6cf",
    storageBucket: "tungproject-8f6cf.firebasestorage.app",
    messagingSenderId: "602713548775",
    appId: "1:602713548775:web:3e9addfaff7d31aaa97f42"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.querySelector('form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const tipo = document.getElementById('tipoConta').value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
      const uid = userCredential.user.uid;

      await setDoc(doc(db, "usuarios", uid), {
        nome: nome,
        email: email,
        tipo: tipo
      });

      window.location = tipo === "professor" ? "painel-professor.html" : "painel-aluno.html";
    } catch (erro) {
      alert("Erro ao criar conta: " + erro.message);
    }
  });
</script>

</body>
 
</html>
